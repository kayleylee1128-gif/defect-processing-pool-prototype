<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>其他出库 - 返修出库</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d9d9d9;
      --border-light: #edf0f5;
      --bg: #f5f7fa;
      --header: #5aa7e8;
      --danger: #ff4d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5715;
    }
    button, input, select { font: inherit; }
    .topbar {
      height: 44px;
      background: var(--header);
      color: #fff;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 4px rgba(31, 74, 120, .18);
    }
    .brand {
      width: 52px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #faad14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.05;
    }
    .menu-toggle {
      width: 48px;
      text-align: center;
      font-size: 20px;
      opacity: .95;
    }
    .main-nav {
      height: 44px;
      display: flex;
      align-items: stretch;
    }
    .main-nav a {
      min-width: 104px;
      padding: 0 16px;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .main-nav a.active {
      background: rgba(22, 119, 255, .18);
      font-weight: 600;
    }
    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-right: 20px;
      color: rgba(255,255,255,.95);
    }
    .top-icon { font-size: 17px; }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1f2937;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .layout {
      display: grid;
      grid-template-columns: 52px minmax(1180px, 1fr);
      min-height: calc(100vh - 44px);
    }
    .sidebar {
      background: #fff;
      border-right: 1px solid #e6ebf2;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .side-icon {
      width: 28px;
      height: 28px;
      color: #3b4654;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 18px;
    }
    .side-icon.active {
      background: #e6f4ff;
      color: var(--primary);
    }
    .content {
      padding: 12px 16px 16px;
      overflow-x: auto;
    }
    .card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
      border: 1px solid #edf0f5;
    }
    .filter-card {
      padding: 14px 20px 16px;
      margin-bottom: 12px;
    }
    .biz-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .biz-tab {
      height: 34px;
      min-width: 96px;
      padding: 0 18px;
      border: 1px solid var(--border);
      background: #fff;
      color: #475467;
      border-radius: 4px;
      cursor: pointer;
      transition: all .18s;
    }
    .biz-tab:hover {
      color: var(--primary);
      border-color: var(--primary-hover);
    }
    .biz-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .state-tabs {
      display: flex;
      align-items: center;
      gap: 28px;
      min-height: 38px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .state-tab {
      height: 38px;
      color: #344054;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      transition: all .18s;
    }
    .state-tab:hover { color: var(--primary); }
    .state-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 500;
    }
    .filters {
      display: grid;
      grid-template-columns: 220px 120px 230px 170px 170px 160px 160px minmax(230px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }
    .input, .select {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: #344054;
      padding: 0 11px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .input:focus, .select:focus, .date-range:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, .1);
    }
    .input::placeholder { color: #bfbfbf; }
    .select { color: #667085; }
    .date-range {
      display: grid;
      grid-template-columns: 1fr 24px 1fr;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 32px;
      padding: 0 10px;
      color: #98a2b3;
      transition: border-color .18s, box-shadow .18s;
    }
    .date-range input {
      border: 0;
      outline: 0;
      min-width: 0;
      color: #344054;
    }
    .btn {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 16px;
      background: #fff;
      color: #344054;
      cursor: pointer;
      white-space: nowrap;
      transition: all .18s;
    }
    .btn:hover {
      color: var(--primary);
      border-color: var(--primary-hover);
    }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 2px 0 rgba(5, 145, 255, .1);
    }
    .btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
    }
    .btn.danger-light {
      color: var(--danger);
      background: #fff;
      border-color: #ffccc7;
    }
    .table-card {
      padding: 18px 20px 14px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .table-wrap {
      border: 1px solid var(--border-light);
      border-radius: 4px;
      overflow: auto;
      max-height: calc(100vh - 300px);
      background: #fff;
    }
    table {
      width: 100%;
      min-width: 1760px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
      padding: 13px 12px;
      vertical-align: top;
      text-align: left;
      line-height: 1.75;
      color: #667085;
      word-break: break-word;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 44px;
      padding: 10px 12px;
      color: #1f2937;
      font-weight: 600;
      background: #fafafa;
    }
    tr:hover td { background: #fafcff; }
    .check-col { width: 44px; text-align: center; }
    .order-col { width: 250px; }
    .type-col { width: 160px; }
    .warehouse-col { width: 220px; }
    .sku-col { width: 220px; }
    .logistics-col { width: 230px; }
    .receiver-col { width: 275px; }
    .other-col { width: 220px; }
    .time-col { width: 260px; }
    .action-col { width: 82px; text-align: center; }
    .link {
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover { color: var(--primary-hover); }
    .link-danger { color: var(--danger); }
    .status-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      background: #e6f4ff;
      color: var(--primary);
      border: 1px solid #91caff;
      font-size: 12px;
      margin-top: 4px;
    }
    .checkbox {
      width: 18px;
      height: 18px;
      border: 1px solid #d9d9d9;
      border-radius: 3px;
      display: inline-block;
      background: #fff;
    }
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding-top: 14px;
      color: #667085;
    }
    .page-btn {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      border-radius: 4px;
      cursor: pointer;
    }
    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .setting-float {
      position: fixed;
      right: 0;
      top: 176px;
      width: 40px;
      height: 40px;
      border-radius: 6px 0 0 6px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(22, 119, 255, .28);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-badge">PRMS<br>售</div></div>
    <div class="menu-toggle">☰</div>
    <nav class="main-nav">
      <a href="#">首页</a>
      <a class="active" href="#">其他出库 ×</a>
    </nav>
    <div class="top-actions">
      <span class="top-icon">◷</span>
      <span class="top-icon">⇩</span>
      <span class="top-icon">⌕</span>
      <span class="top-icon">⛶</span>
      <span class="avatar">李</span>
      <span>欢迎您, 李静</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-icon active">⌂</div>
      <div class="side-icon">▣</div>
      <div class="side-icon">▤</div>
      <div class="side-icon">▥</div>
      <div class="side-icon">◉</div>
      <div class="side-icon">▦</div>
      <div class="side-icon">◌</div>
      <div class="side-icon">▣</div>
      <div class="side-icon">◍</div>
      <div class="side-icon">▥</div>
    </aside>

    <main class="content">
      <section class="card filter-card">
        <div class="biz-tabs">
          <button class="biz-tab">借物出库</button>
          <button class="biz-tab">报损出库</button>
          <button class="biz-tab active">返修出库</button>
        </div>

        <div class="state-tabs">
          <div class="state-tab">全部 (31)</div>
          <div class="state-tab">待审核 (0)</div>
          <div class="state-tab">待仓库作业 (0)</div>
          <div class="state-tab">已出库 (8)</div>
          <div class="state-tab active">返修中 (21)</div>
          <div class="state-tab">异常 (0)</div>
          <div class="state-tab">已完成 (2)</div>
          <div class="state-tab">审核拒绝 (0)</div>
          <div class="state-tab">取消 (0)</div>
        </div>

        <div class="filters">
          <select class="select"><option>请选择出库仓库</option><option>SZ01东莞仓</option><option>海外仓中转仓</option></select>
          <select class="select"><option>单号</option><option>SKU</option><option>供应商</option></select>
          <input class="input" placeholder="请输入" />
          <select class="select"><option>请选择创建人</option><option>张晶</option><option>李静</option></select>
          <select class="select"><option>请选择审核状态</option><option>待审核</option><option>审核通过</option></select>
          <select class="select"><option>返修状态</option><option>返修中</option><option>已完成</option><option>异常</option></select>
          <select class="select"><option>创建时间</option><option>更新时间</option></select>
          <div class="date-range"><input placeholder="开始日期" /><span>-</span><input placeholder="结束日期" /></div>
          <button class="btn primary">搜索</button>
          <button class="btn">重置</button>
        </div>
      </section>

      <section class="card table-card">
        <div class="toolbar">
          <button class="btn primary">新建返修出库</button>
          <button class="btn danger-light">取消</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="check-col"><span class="checkbox"></span></th>
                <th class="order-col">单号</th>
                <th class="type-col">单据类型</th>
                <th class="warehouse-col">出库信息</th>
                <th class="sku-col">sku信息</th>
                <th class="logistics-col">物流信息</th>
                <th class="receiver-col">收件人信息</th>
                <th class="other-col">其他</th>
                <th class="time-col">时间</th>
                <th class="action-col">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>共 21 条</span>
          <select class="select" style="width:110px;min-width:110px"><option>20条/页</option></select>
          <button class="page-btn">‹</button>
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">›</button>
          <span>前往</span>
          <input class="input" style="width:52px;min-width:52px;text-align:center" value="1" />
          <span>页</span>
        </div>
      </section>
    </main>
  </div>

  <div class="setting-float">⚙</div>

  <script>
    const rows = [
      { no:'RX26061700004', out:'CK2606170007', warehouse:'SZ01东莞仓', time:'2026-04-17 19:43:49', style:1, qty:1, sku:'SKU-ALPHA-001', vendor:'深圳启明电子', status:'返修中', logistics:'773416468912182', channel:'国内线下-申通快递-谢岗', receiver:'张晶', phone:'18975537514', address:'中国广东省深圳市龙岗区金鸿德电商产业园C栋5楼（前台收）', create:'2026-04-17 15:22:49', update:'2026-04-21 11:02:38' },
      { no:'RX26041700003', out:'CK2604170005', warehouse:'海外仓中转仓', time:'2026-04-17 11:41:03', style:2, qty:2, sku:'SKU-BETA-118', vendor:'宁波辰禾能源', status:'返修中', logistics:'773416385726759', channel:'国内线下-申通快递-谢岗', receiver:'张晶', phone:'18975537514', address:'中国广东省深圳市龙岗区金鸿德电商产业园C栋5楼（前台收）', create:'2026-04-17 10:35:21', update:'2026-04-21 11:02:34' },
      { no:'RX26041700002', out:'CK2604170004', warehouse:'SZ01东莞仓', time:'2026-04-17 11:41:03', style:8, qty:8, sku:'SKU-GAMMA-320', vendor:'苏州松岭科技', status:'返修中', logistics:'773416385726759', channel:'国内线下-申通快递-谢岗', receiver:'张晶', phone:'18975537514', address:'中国广东省深圳市龙岗区金鸿德电商产业园C栋5楼（前台收）', create:'2026-04-17 10:34:25', update:'2026-04-21 11:01:52' },
      { no:'RX26041400001', out:'CK2604140001', warehouse:'SZ01东莞仓', time:'2026-04-14 16:14:49', style:2, qty:2, sku:'SKU-DELTA-056', vendor:'杭州图灵视觉', status:'返修中', logistics:'773415920201178', channel:'国内线下-申通快递-谢岗', receiver:'张晶', phone:'18975537514', address:'中国广东省深圳市龙岗区金鸿德电商产业园C栋5楼（前台收）', create:'2026-04-14 10:41:06', update:'2026-04-21 11:01:48' },
      { no:'RX26041000002', out:'CK2604100002', warehouse:'SZ01东莞仓', time:'2026-04-10 18:46:37', style:2, qty:2, sku:'SKU-EPS-205', vendor:'东莞锐鑫电子', status:'返修中', logistics:'773415281422994', channel:'淘宝-申通（谢岗）', receiver:'张晶', phone:'18975537514', address:'中国广东省深圳市龙岗区金鸿德电商产业园C栋5楼（前台收）', create:'2026-04-10 11:07:04', update:'2026-04-17 09:48:53' }
    ];

    const body = document.querySelector('#tableBody');
    body.innerHTML = rows.map(row => `
      <tr>
        <td class="check-col"><span class="checkbox"></span></td>
        <td>
          单号：<a class="link">${row.no}</a><br>
          出库单号：${row.out}<br>
          关联单号：-<br>
          <span class="status-tag">${row.status}</span>
        </td>
        <td>返修出库</td>
        <td>出库仓库：${row.warehouse}<br>出库时间：${row.time}</td>
        <td>
          款数：<a class="link">${row.style}</a><br>
          sku数量：<a class="link">${row.qty}</a><br>
          SKU：${row.sku}<br>
          供应商：${row.vendor}<br>
          库存类型：次品
        </td>
        <td>物流单号：${row.logistics}<br>物流渠道：${row.channel}<br>运费：- CNY</td>
        <td>收件人：${row.receiver}<br>收件电话：${row.phone}<br>收件人地址：${row.address}</td>
        <td>所属部门：产品开发中心-工业开发部<br>备注：返修出库<br>附件：<a class="link">上传</a></td>
        <td>创建人：张晶<br>创建时间：${row.create}<br>更新人：张晶<br>更新时间：${row.update}</td>
        <td class="action-col">
          <a class="link">查看</a><br>
          <a class="link">归还</a><br>
          <a class="link-danger">报损</a><br>
          <a class="link">日志</a>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.biz-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.biz-tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
      });
    });
    document.querySelectorAll('.state-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.state-tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>
</body>
</html>
